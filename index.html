<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FRALEN CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1B2A6B;
  --navy-dark: #111C4E;
  --navy-light: #2A3F8F;
  --accent: #4F6BF0;
  --white: #FFFFFF;
  --gray: #6B7280;
  --input-border: #D1D5DB;
  --bg: #F0F2FA;
}
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
#splash {
  position: fixed; inset: 0; background: var(--navy);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; transition: opacity 0.6s ease, visibility 0.6s ease;
}
#splash.hide { opacity: 0; visibility: hidden; }
.splash-logo { display: flex; flex-direction: column; align-items: center; gap: 16px; animation: fadeUp 0.8s ease forwards; }
.splash-icon { width: 80px; height: 80px; background: rgba(255,255,255,0.12); border-radius: 22px; display: flex; align-items: center; justify-content: center; }
.splash-icon svg { width: 46px; height: 46px; fill: none; stroke: white; stroke-width: 1.8; }
.splash-brand { font-family: 'Montserrat', sans-serif; font-size: 38px; font-weight: 900; color: white; letter-spacing: 6px; text-transform: uppercase; }
.splash-brand span { color: #7B93FF; }
.splash-tagline { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 3px; text-transform: uppercase; margin-top: -8px; }
.splash-dots { margin-top: 64px; display: flex; gap: 8px; animation: fadeUp 0.8s ease 0.3s both; }
.splash-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.25); animation: pulse 1.2s ease infinite; }
.splash-dots span:nth-child(2) { animation-delay: 0.2s; }
.splash-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 100% { background: rgba(255,255,255,0.2); transform: scale(1); } 50% { background: rgba(255,255,255,0.8); transform: scale(1.3); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
#login-page {
  width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; animation: fadeIn 0.6s ease 2.2s forwards;
}
@keyframes fadeIn { to { opacity: 1; } }
.login-card { background: white; border-radius: 24px; padding: 44px 40px; width: 100%; max-width: 420px; box-shadow: 0 8px 40px rgba(27,42,107,0.10); }
.login-header { text-align: center; margin-bottom: 28px; }
.login-logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.login-logo-icon { width: 38px; height: 38px; background: var(--navy); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.login-logo-icon svg { width: 22px; height: 22px; fill: none; stroke: white; stroke-width: 1.8; }
.login-logo-text { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 900; color: var(--navy); letter-spacing: 4px; }
.login-logo-text span { color: var(--accent); }
.login-subtitle { font-size: 13px; color: var(--gray); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }

/* Tabs */
.auth-tabs { display: flex; gap: 6px; background: #F3F4F6; border-radius: 12px; padding: 4px; margin: 24px 0 20px; }
.auth-tab { flex: 1; text-align: center; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--gray); cursor: pointer; user-select: none; }
.auth-tab.active { background: white; color: var(--navy); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
input[type="email"], input[type="password"], input[type="text"], input[type="tel"] {
  width: 100%; padding: 12px 16px; border: 1.5px solid var(--input-border); border-radius: 10px;
  font-size: 14px; font-family: 'Inter', sans-serif; color: #111827; outline: none;
  transition: border-color 0.2s; background: #FAFAFA;
}
input:focus { border-color: var(--accent); background: white; }
input::placeholder { color: #9CA3AF; }
.forgot { text-align: right; margin-top: -6px; margin-bottom: 18px; }
.forgot a { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 500; cursor: pointer; }
.btn-signin {
  width: 100%; padding: 14px; background: var(--navy); color: white; border: none; border-radius: 10px;
  font-size: 15px; font-weight: 600; cursor: pointer; letter-spacing: 0.5px; transition: background 0.2s, transform 0.1s;
}
.btn-signin:hover { background: var(--navy-light); }
.btn-signin:active { transform: scale(0.99); }
.btn-signin.loading { opacity: 0.7; pointer-events: none; }
.error-msg, .success-msg {
  border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none;
}
.error-msg { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; }
.success-msg { background: #ECFDF5; color: #059669; border: 1px solid #A7F3D0; }
.auth-panel { display: none; }
.auth-panel.active { display: block; }
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="splash-logo">
    <div class="splash-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/></svg></div>
    <div class="splash-brand">FRA<span>LEN</span></div>
    <div class="splash-tagline">FRALEN-OPTICAL-CRM</div>
  </div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>

<!-- LOGIN / SIGNUP PAGE -->
<div id="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <div class="login-logo-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/></svg></div>
        <div class="login-logo-text">FRA<span>LEN</span></div>
      </div>
      <div class="login-subtitle">FRALEN-OPTICAL-CRM</div>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="window.showTab('login')">Login</div>
      <div class="auth-tab" id="tab-signup" onclick="window.showTab('signup')">Sign Up</div>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <!-- LOGIN PANEL -->
    <div class="auth-panel active" id="panel-login">
      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="Enter your email" required/>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required/>
        </div>
        <div class="forgot"><a onclick="window.handleForgotPassword()">Forgot password?</a></div>
        <button class="btn-signin" id="signin-btn" type="submit">Sign In</button>
      </form>
    </div>

    <!-- SIGNUP PANEL: creates one FRALEN account per optical shop -->
    <div class="auth-panel" id="panel-signup">
      <form id="signupForm" onsubmit="return false;">
        <div class="form-group">
          <label for="su-shop">Shop Name</label>
          <input type="text" id="su-shop" placeholder="e.g. Eye Shades, Sakinaka" required/>
        </div>
        <div class="form-group">
          <label for="su-owner">Owner Name</label>
          <input type="text" id="su-owner" placeholder="Full name" required/>
        </div>
        <div class="form-group">
          <label for="su-phone">Phone</label>
          <input type="tel" id="su-phone" placeholder="9999999999" required/>
        </div>
        <div class="form-group">
          <label for="su-email">Email</label>
          <input type="email" id="su-email" placeholder="Enter your email" required/>
        </div>
        <div class="form-group">
          <label for="su-password">Password</label>
          <input type="password" id="su-password" placeholder="Minimum 6 characters" required/>
        </div>
        <button class="btn-signin" id="signup-btn" type="submit">Create Account</button>
      </form>
    </div>

  </div>
</div>

<script>
  // Splash hide
  setTimeout(() => { document.getElementById('splash').classList.add('hide'); }, 2000);

  window.showTab = function (which) {
    document.getElementById('tab-login').classList.toggle('active', which === 'login');
    document.getElementById('tab-signup').classList.toggle('active', which === 'signup');
    document.getElementById('panel-login').classList.toggle('active', which === 'login');
    document.getElementById('panel-signup').classList.toggle('active', which === 'signup');
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('success-msg').style.display = 'none';
  };

  window.showLoginError = function (msg) {
    const err = document.getElementById('error-msg');
    err.textContent = msg;
    err.style.display = 'block';
    document.getElementById('success-msg').style.display = 'none';
  };

  window.showLoginSuccess = function (msg) {
    const ok = document.getElementById('success-msg');
    ok.textContent = msg;
    ok.style.display = 'block';
    document.getElementById('error-msg').style.display = 'none';
  };
</script>

<!-- Auth logic lives in auth.js (imports the shared firebase-config.js) -->
<script type="module" src="auth.js"></script>
</body>
</html>
